      var defaultUrl = "https://wa.me/639469983624?text=Hi%20Stay%20Well%20Massage!%20I%20would%20like%20to%20book%20an%20appointment.";
      var targetUrl = defaultUrl;
      try {

        var isDebug = params.has('gtm_debug') || params.has('gtm_auth') || document.referrer.includes('tagassistant.google.com') || window.location.href.includes('gtm_debug');

        }

          targetUrl = "https://wa.me/639469983624?text=" + encodeURIComponent(text);
          var cta = document.querySelector('a.cta');
          if (cta) cta.href = targetUrl;
        }
      } catch (e) {}
      setTimeout(function () {
        if (typeof gtag_report_conversion === 'function') {
          gtag_report_conversion(targetUrl);
        } else {
          window.location.href = targetUrl;
        }
      }, 2000);
    })();
